<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">AI call-center analytics dashboard</title>
  <desc id="d">A dashboard that extracts the audio of a call between a customer and an agent, transcribes it, uses AI to detect the emotion and tone of both speakers, and rates the agent's performance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".6" stop-color="#0f2a3d"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".15" r=".55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202f"/>
      <stop offset="1" stop-color="#111a27"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset=".5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
    .w { transform-box: fill-box; transform-origin: 50% 50%; animation: wave 1.1s ease-in-out infinite; }
    .w:nth-child(2n) { animation-delay: -.3s; } .w:nth-child(3n) { animation-delay: -.6s; } .w:nth-child(5n) { animation-delay: -.85s; }
    .play { animation: play 6s linear infinite; }
    .b1 { animation: bub 6s ease-out infinite; } .b2 { animation: bub2 6s ease-out infinite; } .b3 { animation: bub3 6s ease-out infinite; }
    .needle { transform-origin: 610px 262px; animation: needle 6s ease-in-out infinite; }
    .score { transform-box: fill-box; transform-origin: 0 50%; animation: score 6s ease-out infinite; }
    .score.s2 { animation-delay: .2s; } .score.s3 { animation-delay: .4s; }
    .ai { animation: aiglow 2s ease-in-out infinite; }
    .rec { animation: blink 1.2s steps(2, jump-none) infinite; }
    @keyframes wave { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    @keyframes play { from { transform: translateX(0); } to { transform: translateX(316px); } }
    @keyframes bub { 0%, 8% { opacity: 0; transform: translateY(6px); } 14%, 100% { opacity: 1; transform: none; } }
    @keyframes bub2 { 0%, 32% { opacity: 0; transform: translateY(6px); } 38%, 100% { opacity: 1; transform: none; } }
    @keyframes bub3 { 0%, 58% { opacity: 0; transform: translateY(6px); } 64%, 100% { opacity: 1; transform: none; } }
    @keyframes needle { 0%, 20% { transform: rotate(-62deg); } 45% { transform: rotate(-10deg); } 70%, 100% { transform: rotate(52deg); } }
    @keyframes score { 0%, 15% { transform: scaleX(0); } 45%, 100% { transform: scaleX(1); } }
    @keyframes aiglow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .needle { transform: rotate(52deg); } }
  </style>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- ===== Left: call audio + transcript ===== -->
  <g filter="url(#shadow)"><rect x="30" y="34" width="420" height="382" rx="16" fill="url(#panel)" stroke="#fff" stroke-opacity=".07"/></g>
  <text x="52" y="66" font-size="12" font-weight="700" fill="#67e8f9" letter-spacing="2">CALL #2048 · RECORDING</text>
  <circle class="rec" cx="420" cy="62" r="6" fill="#f87171"/>

  <!-- speakers -->
  <g font-size="11" font-weight="600">
    <circle cx="62" cy="96" r="12" fill="#38bdf8" fill-opacity=".25"/><text x="62" y="100" text-anchor="middle" fill="#7dd3fc">C</text>
    <text x="82" y="100" fill="#cbd5e1">Customer</text>
    <circle cx="62" cy="138" r="12" fill="#a78bfa" fill-opacity=".25"/><text x="62" y="142" text-anchor="middle" fill="#c4b5fd">A</text>
    <text x="82" y="142" fill="#cbd5e1">Agent</text>
  </g>
  <!-- waveforms -->
  <g fill="#38bdf8">
    <rect class="w" x="150" y="86" width="4" height="20" rx="2"/><rect class="w" x="158" y="82" width="4" height="28" rx="2"/><rect class="w" x="166" y="88" width="4" height="16" rx="2"/><rect class="w" x="174" y="80" width="4" height="32" rx="2"/><rect class="w" x="182" y="86" width="4" height="20" rx="2"/><rect class="w" x="190" y="90" width="4" height="12" rx="2"/><rect class="w" x="198" y="84" width="4" height="24" rx="2"/><rect class="w" x="206" y="80" width="4" height="32" rx="2"/><rect class="w" x="214" y="88" width="4" height="16" rx="2"/><rect class="w" x="222" y="84" width="4" height="24" rx="2"/>
    <rect class="w" x="300" y="88" width="4" height="16" rx="2"/><rect class="w" x="308" y="82" width="4" height="28" rx="2"/><rect class="w" x="316" y="86" width="4" height="20" rx="2"/><rect class="w" x="324" y="80" width="4" height="32" rx="2"/><rect class="w" x="332" y="88" width="4" height="16" rx="2"/><rect class="w" x="340" y="84" width="4" height="24" rx="2"/>
  </g>
  <g fill="#a78bfa">
    <rect class="w" x="232" y="130" width="4" height="16" rx="2"/><rect class="w" x="240" y="126" width="4" height="24" rx="2"/><rect class="w" x="248" y="122" width="4" height="32" rx="2"/><rect class="w" x="256" y="128" width="4" height="20" rx="2"/><rect class="w" x="264" y="124" width="4" height="28" rx="2"/><rect class="w" x="272" y="130" width="4" height="16" rx="2"/><rect class="w" x="280" y="126" width="4" height="24" rx="2"/><rect class="w" x="288" y="132" width="4" height="12" rx="2"/>
    <rect class="w" x="352" y="128" width="4" height="20" rx="2"/><rect class="w" x="360" y="122" width="4" height="32" rx="2"/><rect class="w" x="368" y="126" width="4" height="24" rx="2"/><rect class="w" x="376" y="130" width="4" height="16" rx="2"/><rect class="w" x="384" y="124" width="4" height="28" rx="2"/><rect class="w" x="392" y="128" width="4" height="20" rx="2"/>
  </g>
  <!-- playhead -->
  <g class="play"><rect x="140" y="76" width="2" height="82" fill="#fff" fill-opacity=".85"/><circle cx="141" cy="76" r="4" fill="#fff"/></g>
  <line x1="140" y1="166" x2="430" y2="166" stroke="#fff" stroke-opacity=".08"/>

  <!-- transcript bubbles with emotion tags -->
  <text x="52" y="190" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5">AI TRANSCRIPT + EMOTION</text>
  <g class="b1">
    <rect x="52" y="202" width="260" height="46" rx="12" fill="#0e2236" stroke="#38bdf8" stroke-opacity=".35"/>
    <text x="66" y="222" font-size="11.5" fill="#e2e8f0">My device stopped syncing again…</text>
    <rect x="66" y="230" width="86" height="12" rx="6" fill="#f87171" fill-opacity=".2"/><text x="74" y="240" font-size="9.5" font-weight="700" fill="#fca5a5">😠 Frustrated</text>
  </g>
  <g class="b2">
    <rect x="138" y="258" width="292" height="46" rx="12" fill="#1c1838" stroke="#a78bfa" stroke-opacity=".35"/>
    <text x="152" y="278" font-size="11.5" fill="#e2e8f0">I'm sorry — let's fix it together now.</text>
    <rect x="152" y="286" width="112" height="12" rx="6" fill="#4ade80" fill-opacity=".18"/><text x="160" y="296" font-size="9.5" font-weight="700" fill="#86efac">🙂 Calm · Empathetic</text>
  </g>
  <g class="b3">
    <rect x="52" y="314" width="260" height="46" rx="12" fill="#0e2236" stroke="#38bdf8" stroke-opacity=".35"/>
    <text x="66" y="334" font-size="11.5" fill="#e2e8f0">It works now, thank you so much!</text>
    <rect x="66" y="342" width="82" height="12" rx="6" fill="#4ade80" fill-opacity=".18"/><text x="74" y="352" font-size="9.5" font-weight="700" fill="#86efac">😊 Satisfied</text>
  </g>
  <g class="ai">
    <rect x="330" y="372" width="100" height="28" rx="14" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/>
    <path d="M346 378l2.5 6.5 6.5 2.5-6.5 2.5-2.5 6.5-2.5-6.5-6.5-2.5 6.5-2.5z" fill="#67e8f9"/>
    <text x="362" y="391" font-size="11" font-weight="700" fill="#a5f3fc">AI analysis</text>
  </g>

  <!-- ===== Right: sentiment gauge + agent score ===== -->
  <g filter="url(#shadow)"><rect x="468" y="34" width="302" height="186" rx="16" fill="url(#panel)" stroke="#fff" stroke-opacity=".07"/></g>
  <text x="488" y="66" font-size="12" font-weight="700" fill="#67e8f9" letter-spacing="2">CUSTOMER SENTIMENT</text>
  <path d="M530 262 A80 80 0 0 1 690 262" fill="none" stroke="#1f2a3a" stroke-width="16" transform="translate(0 -60)"/>
  <path d="M530 262 A80 80 0 0 1 690 262" fill="none" stroke="url(#gauge)" stroke-width="16" stroke-linecap="round" transform="translate(0 -60)"/>
  <g transform="translate(0 -60)">
    <g class="needle"><path d="M607 262 L610 196 L613 262 Z" fill="#e2e8f0"/></g>
    <circle cx="610" cy="262" r="9" fill="#e2e8f0"/><circle cx="610" cy="262" r="4" fill="#0f172a"/>
  </g>
  <text x="530" y="218" font-size="10" fill="#fca5a5" text-anchor="middle">Negative</text>
  <text x="690" y="218" font-size="10" fill="#86efac" text-anchor="middle">Positive</text>

  <g filter="url(#shadow)"><rect x="468" y="236" width="302" height="180" rx="16" fill="url(#panel)" stroke="#fff" stroke-opacity=".07"/></g>
  <text x="488" y="266" font-size="12" font-weight="700" fill="#67e8f9" letter-spacing="2">AGENT PERFORMANCE</text>
  <text x="750" y="268" text-anchor="end" font-size="22" font-weight="800" fill="#4ade80">8.4<tspan font-size="12" fill="#94a3b8">/10</tspan></text>
  <g font-size="11" fill="#cbd5e1">
    <text x="488" y="300">Empathy</text>
    <rect x="590" y="291" width="160" height="10" rx="5" fill="#1f2a3a"/><rect class="score" x="590" y="291" width="150" height="10" rx="5" fill="#4ade80"/>
    <text x="488" y="332">Resolution</text>
    <rect x="590" y="323" width="160" height="10" rx="5" fill="#1f2a3a"/><rect class="score s2" x="590" y="323" width="144" height="10" rx="5" fill="#22d3ee"/>
    <text x="488" y="364">Tone</text>
    <rect x="590" y="355" width="160" height="10" rx="5" fill="#1f2a3a"/><rect class="score s3" x="590" y="355" width="132" height="10" rx="5" fill="#a78bfa"/>
  </g>
  <text x="488" y="398" font-size="10.5" fill="#64748b">Scored automatically from the call audio</text>
</svg>
