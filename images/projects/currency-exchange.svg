<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Currency Exchange App</title>
  <desc id="d">A phone showing a currency converter app. The selected currencies change between US dollars, euros, British pounds and Egyptian pounds while a rate chart draws and currency symbols float around the phone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset=".55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="scr"><rect x="306" y="40" width="188" height="374" rx="26"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Inter, Arial, sans-serif; }
    .float { animation: float 6s ease-in-out infinite; }
    .f2 { animation-delay: -1.5s; } .f3 { animation-delay: -3s; } .f4 { animation-delay: -4.5s; } .f5 { animation-delay: -2.2s; } .f6 { animation-delay: -3.7s; }
    .swap { transform-box: fill-box; transform-origin: center; animation: swap 9s ease-in-out infinite; }
    .s1 { animation: s1 9s linear infinite; } .s2 { animation: s2 9s linear infinite; } .s3 { animation: s3 9s linear infinite; }
    .line { stroke-dasharray: 260; animation: draw 3s ease-out infinite; }
    .dot { animation: pulse 1.5s ease-in-out infinite; }
    .btn { animation: press 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes swap { 0%, 28% { transform: rotate(0); } 33%, 61% { transform: rotate(180deg); } 66%, 94% { transform: rotate(360deg); } 100% { transform: rotate(360deg); } }
    @keyframes s1 { 0%, 31% { opacity: 1; } 33.3%, 100% { opacity: 0; } }
    @keyframes s2 { 0%, 33% { opacity: 0; } 33.4%, 64% { opacity: 1; } 66.6%, 100% { opacity: 0; } }
    @keyframes s3 { 0%, 66.5% { opacity: 0; } 66.7%, 97% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { r: 4; opacity: 1; } 50% { r: 7; opacity: .55; } }
    @keyframes press { 0%, 85%, 100% { transform: scale(1); } 90% { transform: scale(.96); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .s2, .s3 { opacity: 0; } .line { stroke-dashoffset: 0; } }
  </style>

  <!-- background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- floating currency symbols -->
  <g font-weight="700" fill="#fff">
    <g class="float"><circle cx="150" cy="110" r="38" fill="#fff" fill-opacity=".1"/><text x="150" y="126" text-anchor="middle" font-size="44" fill-opacity=".9">$</text></g>
    <g class="float f2"><circle cx="96" cy="270" r="30" fill="#fff" fill-opacity=".08"/><text x="96" y="283" text-anchor="middle" font-size="34" fill-opacity=".85">€</text></g>
    <g class="float f3"><circle cx="210" cy="360" r="26" fill="#fff" fill-opacity=".08"/><text x="210" y="371" text-anchor="middle" font-size="30" fill-opacity=".8">£</text></g>
    <g class="float f4"><circle cx="650" cy="96" r="34" fill="#fff" fill-opacity=".1"/><text x="650" y="109" text-anchor="middle" font-size="36" fill-opacity=".9">¥</text></g>
    <g class="float f5"><circle cx="706" cy="250" r="28" fill="#fff" fill-opacity=".08"/><text x="706" y="261" text-anchor="middle" font-size="28" fill-opacity=".85">E£</text></g>
    <g class="float f6"><circle cx="594" cy="356" r="26" fill="#fff" fill-opacity=".08"/><text x="594" y="366" text-anchor="middle" font-size="28" fill-opacity=".8">₹</text></g>
  </g>

  <!-- side rate cards -->
  <g class="float f2">
    <rect x="200" y="170" width="92" height="54" rx="12" fill="#ffffff" fill-opacity=".12" stroke="#fff" stroke-opacity=".2"/>
    <text x="214" y="192" font-size="11" fill="#e0e7ff">USD / EGP</text>
    <text x="214" y="212" font-size="13" font-weight="700" fill="#86efac">▲ live rate</text>
  </g>
  <g class="float f4">
    <rect x="510" y="186" width="96" height="54" rx="12" fill="#ffffff" fill-opacity=".12" stroke="#fff" stroke-opacity=".2"/>
    <text x="524" y="208" font-size="11" fill="#e0e7ff">EUR / USD</text>
    <text x="524" y="228" font-size="13" font-weight="700" fill="#fca5a5">▼ live rate</text>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="296" y="28" width="208" height="398" rx="34" fill="#0b0f1a"/>
  </g>
  <rect x="306" y="40" width="188" height="374" rx="26" fill="url(#screen)"/>
  <g clip-path="url(#scr)">
    <!-- header -->
    <rect x="306" y="40" width="188" height="92" fill="url(#accent)"/>
    <rect x="370" y="48" width="60" height="16" rx="8" fill="#0b0f1a"/>
    <text x="322" y="90" font-size="15" font-weight="700" fill="#fff">Currency</text>
    <text x="322" y="108" font-size="15" font-weight="700" fill="#fff">Converter</text>
    <circle cx="472" cy="96" r="12" fill="#fff" fill-opacity=".22"/>
    <path d="M466 96h12M472 90v12" stroke="#fff" stroke-width="2" stroke-linecap="round" transform="rotate(45 472 96)"/>

    <!-- FROM field -->
    <text x="322" y="152" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">FROM</text>
    <rect x="318" y="158" width="164" height="46" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <!-- TO field -->
    <text x="322" y="250" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">TO</text>
    <rect x="318" y="256" width="164" height="46" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>

    <!-- state 1: USD -> EGP -->
    <g class="s1">
      <circle cx="338" cy="181" r="11" fill="#1d4ed8"/><text x="338" y="185" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">US</text>
      <text x="354" y="186" font-size="13" font-weight="700" fill="#0f172a">USD</text>
      <text x="472" y="186" text-anchor="end" font-size="15" font-weight="700" fill="#0f172a">100.00</text>
      <circle cx="338" cy="279" r="11" fill="#b91c1c"/><text x="338" y="283" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">EG</text>
      <text x="354" y="284" font-size="13" font-weight="700" fill="#0f172a">EGP</text>
      <text x="472" y="284" text-anchor="end" font-size="15" font-weight="700" fill="#4338ca">4,850.00</text>
    </g>
    <!-- state 2: EUR -> USD -->
    <g class="s2">
      <circle cx="338" cy="181" r="11" fill="#1e3a8a"/><text x="338" y="185" text-anchor="middle" font-size="9" font-weight="700" fill="#fde047">EU</text>
      <text x="354" y="186" font-size="13" font-weight="700" fill="#0f172a">EUR</text>
      <text x="472" y="186" text-anchor="end" font-size="15" font-weight="700" fill="#0f172a">250.00</text>
      <circle cx="338" cy="279" r="11" fill="#1d4ed8"/><text x="338" y="283" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">US</text>
      <text x="354" y="284" font-size="13" font-weight="700" fill="#0f172a">USD</text>
      <text x="472" y="284" text-anchor="end" font-size="15" font-weight="700" fill="#4338ca">270.00</text>
    </g>
    <!-- state 3: GBP -> EGP -->
    <g class="s3">
      <circle cx="338" cy="181" r="11" fill="#7f1d1d"/><text x="338" y="185" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">GB</text>
      <text x="354" y="186" font-size="13" font-weight="700" fill="#0f172a">GBP</text>
      <text x="472" y="186" text-anchor="end" font-size="15" font-weight="700" fill="#0f172a">50.00</text>
      <circle cx="338" cy="279" r="11" fill="#b91c1c"/><text x="338" y="283" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">EG</text>
      <text x="354" y="284" font-size="13" font-weight="700" fill="#0f172a">EGP</text>
      <text x="472" y="284" text-anchor="end" font-size="15" font-weight="700" fill="#4338ca">3,075.00</text>
    </g>

    <!-- swap button -->
    <circle cx="400" cy="230" r="17" fill="url(#accent)"/>
    <g class="swap" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M394 222v16l-4-4M406 238v-16l4 4"/>
    </g>

    <!-- chart -->
    <text x="322" y="328" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">7-DAY TREND</text>
    <path d="M322 384 L342 374 L362 378 L382 360 L402 366 L422 350 L442 354 L478 338 L478 392 L322 392 Z" fill="url(#area)"/>
    <path class="line" d="M322 384 L342 374 L362 378 L382 360 L402 366 L422 350 L442 354 L478 338" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="dot" cx="478" cy="338" r="4" fill="#6366f1"/>

    <!-- convert button -->
    <g class="btn"><rect x="318" y="398" width="164" height="0" rx="12" fill="url(#accent)"/></g>
  </g>
  <!-- home indicator -->
  <rect x="370" y="404" width="60" height="4" rx="2" fill="#0f172a" fill-opacity=".25"/>
</svg>
