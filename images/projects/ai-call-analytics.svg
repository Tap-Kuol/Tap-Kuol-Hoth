<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">AI call-analytics concept</title>
  <desc id="d">Concept illustration: an audio wave flows into an AI node and comes out as a simple chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#14213f"/></linearGradient>
    <linearGradient id="cv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <radialGradient id="gl"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity=".06"/></pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Inter, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #a3b1c7; text-anchor: middle; }
    .w { transform-box: fill-box; transform-origin: 50% 50%; animation: w 1.3s ease-in-out infinite alternate; }
    .w:nth-child(2n) { animation-delay: -.5s; } .w:nth-child(3n) { animation-delay: -.9s; }
    .b { transform-box: fill-box; transform-origin: 50% 100%; animation: b 5s ease-in-out infinite; }
    .b:nth-child(2) { animation-delay: .2s; } .b:nth-child(3) { animation-delay: .4s; } .b:nth-child(4) { animation-delay: .6s; }
    .p { animation: p 2.6s linear infinite; }
    @keyframes w { from { transform: scaleY(.4); } }
    @keyframes b { 0%, 100% { transform: scaleY(.55); } 50% { transform: none; } }
    @keyframes p { from { transform: translateX(0); opacity: 1; } to { transform: translateX(86px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .w, .b, .p { animation: none; } }
  </style>
  <rect width="800" height="450" fill="url(#bg)"/><rect width="800" height="450" fill="url(#gr)"/>
  <circle cx="400" cy="215" r="200" fill="url(#gl)"/>
  <g fill="#22d3ee"><rect class="w" x="70" y="185" width="10" height="60" rx="5"/><rect class="w" x="90" y="165" width="10" height="100" rx="5"/><rect class="w" x="110" y="145" width="10" height="140" rx="5"/><rect class="w" x="130" y="175" width="10" height="80" rx="5"/><rect class="w" x="150" y="155" width="10" height="120" rx="5"/><rect class="w" x="170" y="180" width="10" height="70" rx="5"/><rect class="w" x="190" y="160" width="10" height="110" rx="5"/><rect class="w" x="210" y="190" width="10" height="50" rx="5"/></g>
  <path d="M240 215H318M482 215H560" stroke="#3b4d72" stroke-width="2" stroke-dasharray="5 7"/>
  <circle class="p" cx="236" cy="215" r="6" fill="#fb923c"/><circle class="p" cx="478" cy="215" r="6" fill="#fb923c"/>
  <g stroke="url(#cv)" stroke-width="4" fill="#0f1626"><path d="M360 135v-28M400 135v-28M440 135v-28M360 323v-28M400 323v-28M440 323v-28" /><rect x="320" y="135" width="160" height="160" rx="24"/></g>
  <text x="400" y="236" style="font-size:60px;font-weight:800;fill:#f1f6fd">AI</text>
  <g fill="url(#cv)"><rect class="b" x="580" y="205" width="28" height="80" rx="5"/><rect class="b" x="620" y="175" width="28" height="110" rx="5"/><rect class="b" x="660" y="190" width="28" height="95" rx="5"/><rect class="b" x="700" y="145" width="28" height="140" rx="5"/></g>
  <path d="M570 290H740" stroke="#3b4d72" stroke-width="2"/>
  <text x="145" y="365">Audio</text><text x="400" y="365">Analysis</text><text x="655" y="365">Insights</text>
</svg>
