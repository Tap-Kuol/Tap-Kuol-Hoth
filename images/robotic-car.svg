<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">Rover-1 — an obstacle-avoiding robotic car built by a first-year team of four</title>
  <desc id="d">Rover-1, a four-wheel-drive robotic car, drives along, its ultrasonic sensor detects a box ahead, the car stops, scans left and right, then turns left and drives on. A laptop sends control signals to the car.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#122238"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#0891b2" stop-opacity=".32"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <pattern id="minigrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#22d3ee" stroke-opacity=".08"/>
    </pattern>
    <radialGradient id="metal" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset=".6" stop-color="#b9c0c8"/>
      <stop offset="1" stop-color="#7d8792"/>
    </radialGradient>
    <pattern id="mesh" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#1a1d22"/>
      <circle cx="2" cy="2" r=".9" fill="#3a3f47"/>
    </pattern>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset=".25" stop-color="#16181c"/>
      <stop offset="1" stop-color="#0d0e11"/>
    </linearGradient>
    <linearGradient id="motor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#e0aa10"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c08a4e"/>
      <stop offset="1" stop-color="#8f6131"/>
    </linearGradient>

    <g id="wheel">
      <circle r="56" fill="#121316"/>
      <circle r="51" fill="none" stroke="#2b2e34" stroke-width="8" stroke-dasharray="7 6"/>
      <circle r="35" fill="#f5c518"/>
      <circle r="35" fill="none" stroke="#d29e0c" stroke-width="3"/>
      <g fill="#d29e0c">
        <rect x="-4" y="-31" width="8" height="24" rx="3"/>
        <rect x="-4" y="-31" width="8" height="24" rx="3" transform="rotate(72)"/>
        <rect x="-4" y="-31" width="8" height="24" rx="3" transform="rotate(144)"/>
        <rect x="-4" y="-31" width="8" height="24" rx="3" transform="rotate(216)"/>
        <rect x="-4" y="-31" width="8" height="24" rx="3" transform="rotate(288)"/>
      </g>
      <circle r="9" fill="#fbe27a"/>
      <circle r="3.5" fill="#8a6a06"/>
    </g>
  </defs>

  <style>
    /* One 8-second story, looping:
       0–37% drive towards a box · 34–46% obstacle detected, stop · 46–62% scan left/right
       62–78% turn left away from the box · 78–100% drive on, path clear */
    .spin { transform-box: fill-box; transform-origin: center; animation: wheel 8s linear infinite; }
    .body { animation: bob .45s ease-in-out infinite alternate; }
    .road { animation: road 8s linear infinite; }
    .obstacle { animation: obstacle 8s linear infinite; }
    .cyan { animation: cyanvis 8s linear infinite; }
    .echo { animation: echovis 8s linear infinite; }
    .wave { opacity: 0; animation: wave 1.6s ease-out infinite; }
    .wave.w2 { animation-delay: .53s; }
    .wave.w3 { animation-delay: 1.06s; }
    .back { animation: back .8s ease-in infinite; }
    .back.b2 { animation-delay: .4s; }
    .head { transform-box: fill-box; transform-origin: 50% 100%; animation: scan 8s ease-in-out infinite; }
    .led { animation: blink 1.2s steps(2, jump-none) infinite; }
    .led2 { animation: blink .7s steps(2, jump-none) infinite; }
    .sig { opacity: 0; animation: sig 1.5s ease-out infinite; }
    .sig.s2 { animation-delay: .5s; }
    .sig.s3 { animation-delay: 1s; }
    .hud-frame { animation: frame 8s linear infinite; }
    .bar { transform-box: fill-box; transform-origin: 0 50%; animation: bar 8s linear infinite; }
    .h { opacity: 0; }
    .h1 { animation: h1 8s linear infinite; } .h2 { animation: h2 8s linear infinite; }
    .h3 { animation: h3 8s linear infinite; } .h4 { animation: h4 8s linear infinite; }
    .h5 { animation: h5 8s linear infinite; } .h6 { animation: h6 8s linear infinite; }
    .h7 { animation: h7 8s linear infinite; }
    .minicar { offset-path: path("M100 132 L100 88 Q100 72 84 72 L34 72"); offset-rotate: auto; offset-distance: 36%; animation: minicar 8s linear infinite; }
    .miniobs { animation: miniobs 8s linear infinite; }

    @keyframes wheel { 0% { transform: rotate(0); } 37% { transform: rotate(1080deg); } 62% { transform: rotate(1080deg); } 78% { transform: rotate(1260deg); } 100% { transform: rotate(1800deg); } }
    @keyframes road { 0% { stroke-dashoffset: 0; } 37% { stroke-dashoffset: 192; } 62% { stroke-dashoffset: 192; } 78% { stroke-dashoffset: 256; } 100% { stroke-dashoffset: 384; } }
    @keyframes obstacle { 0%, 5% { transform: translateX(170px); opacity: 1; } 37%, 62% { transform: translateX(0); opacity: 1; } 78% { transform: translateX(90px); opacity: 0; } 79% { transform: translateX(170px); opacity: 0; } 80%, 100% { transform: translateX(170px); opacity: 1; } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
    @keyframes cyanvis { 0%, 35% { opacity: 1; } 36%, 62% { opacity: 0; } 63%, 100% { opacity: 1; } }
    @keyframes echovis { 0%, 33.9% { opacity: 0; } 34%, 45.9% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes wave { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: .9; } 100% { opacity: 0; transform: translateX(70px); } }
    @keyframes back { 0% { opacity: 0; transform: translateX(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateX(-34px); } }
    @keyframes scan { 0%, 46% { transform: none; } 50% { transform: scaleX(.78) skewY(-4deg); } 54% { transform: none; } 58% { transform: scaleX(.78) skewY(4deg); } 62%, 100% { transform: none; } }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: .25; } }
    @keyframes sig { 0% { opacity: 0; transform: translateX(0); } 20% { opacity: .9; } 100% { opacity: 0; transform: translateX(24px); } }
    @keyframes frame { 0%, 33.9% { stroke: #22d3ee; } 34%, 45.9% { stroke: #f87171; } 46%, 79.9% { stroke: #fbbf24; } 80%, 100% { stroke: #4ade80; } }
    @keyframes bar { 0% { transform: scaleX(1); fill: #22d3ee; } 33.9% { fill: #22d3ee; } 34% { transform: scaleX(.18); fill: #f87171; } 62% { transform: scaleX(.18); fill: #f87171; } 78% { transform: scaleX(.6); fill: #fbbf24; } 100% { transform: scaleX(1); fill: #4ade80; } }
    @keyframes h1 { 0%, 11.9% { opacity: 1; } 12%, 100% { opacity: 0; } }
    @keyframes h2 { 0%, 11.9% { opacity: 0; } 12%, 23.9% { opacity: 1; } 24%, 100% { opacity: 0; } }
    @keyframes h3 { 0%, 23.9% { opacity: 0; } 24%, 33.9% { opacity: 1; } 34%, 100% { opacity: 0; } }
    @keyframes h4 { 0%, 33.9% { opacity: 0; } 34%, 45.9% { opacity: 1; } 46%, 100% { opacity: 0; } }
    @keyframes h5 { 0%, 45.9% { opacity: 0; } 46%, 61.9% { opacity: 1; } 62%, 100% { opacity: 0; } }
    @keyframes h6 { 0%, 61.9% { opacity: 0; } 62%, 79.9% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes h7 { 0%, 79.9% { opacity: 0; } 80%, 100% { opacity: 1; } }
    @keyframes minicar { 0% { offset-distance: 0%; } 37%, 62% { offset-distance: 36%; } 100% { offset-distance: 100%; } }
    @keyframes miniobs { 0%, 33.9% { fill: #c08a4e; } 34%, 61.9% { fill: #f87171; } 62%, 100% { fill: #c08a4e; } }

    /* Reduced motion: a single still frame at the moment the obstacle is detected */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .h4, .wave, .back { opacity: 1; }
      .cyan { opacity: 0; }
    }
  </style>

  <!-- background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- road -->
  <rect x="0" y="390" width="800" height="60" fill="#0a101b"/>
  <line x1="0" y1="390" x2="800" y2="390" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <line class="road" x1="0" y1="418" x2="800" y2="418" stroke="#ffffff" stroke-opacity=".22" stroke-width="4" stroke-dasharray="36 28"/>
  <ellipse cx="400" cy="392" rx="250" ry="10" fill="#000" opacity=".45"/>

  <!-- obstacle (box) -->
  <g class="obstacle">
    <ellipse cx="736" cy="392" rx="44" ry="6" fill="#000" opacity=".4"/>
    <!-- bottom box -->
    <rect x="698" y="272" width="80" height="118" rx="4" fill="url(#box)"/>
    <rect x="698" y="272" width="80" height="14" rx="3" fill="#d9a466"/>
    <rect x="732" y="272" width="12" height="118" fill="#e8c48c" opacity=".55"/>
    <path d="M708 340 h14 M708 348 h22" stroke="#5c3d1c" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    <!-- top box -->
    <rect x="704" y="150" width="68" height="122" rx="4" fill="url(#box)"/>
    <rect x="704" y="150" width="68" height="13" rx="3" fill="#d9a466"/>
    <rect x="732" y="150" width="12" height="122" fill="#e8c48c" opacity=".55"/>
    <path d="M712 236 l8 -8 l8 8 M720 228 v16" stroke="#5c3d1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".55"/>
  </g>

  <!-- ultrasonic pulses (outgoing, cyan) -->
  <g class="cyan" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round">
    <path class="wave" d="M666 122 Q690 160 666 198"/>
    <path class="wave w2" d="M666 122 Q690 160 666 198"/>
    <path class="wave w3" d="M666 122 Q690 160 666 198"/>
  </g>
  <!-- echo bouncing back from the box (red) -->
  <g class="echo" fill="none" stroke="#f87171" stroke-width="4" stroke-linecap="round">
    <path class="back" d="M698 128 Q676 160 698 192"/>
    <path class="back b2" d="M698 128 Q676 160 698 192"/>
  </g>

  <!-- back wheels -->
  <g opacity=".55">
    <g transform="translate(232 330)"><g class="spin"><use href="#wheel"/></g></g>
    <g transform="translate(560 330)"><g class="spin"><use href="#wheel"/></g></g>
  </g>

  <!-- car body -->
  <g class="body">
    <rect x="262" y="294" width="88" height="34" rx="5" fill="url(#motor)"/>
    <rect x="450" y="294" width="88" height="34" rx="5" fill="url(#motor)"/>
    <rect x="262" y="294" width="88" height="6" rx="3" fill="#fff" opacity=".25"/>
    <rect x="450" y="294" width="88" height="6" rx="3" fill="#fff" opacity=".25"/>
    <circle cx="350" cy="311" r="7" fill="#c9ccd1"/>
    <circle cx="450" cy="311" r="7" fill="#c9ccd1"/>

    <rect x="176" y="276" width="448" height="16" rx="5" fill="url(#plate)"/>
    <rect x="176" y="276" width="448" height="2" rx="1" fill="#ffffff" opacity=".18"/>

    <rect x="286" y="242" width="170" height="32" rx="6" fill="#26282e"/>
    <!-- Rover-1 nameplate -->
    <rect x="294" y="246" width="154" height="24" rx="5" fill="#f97316"/>
    <rect x="294" y="246" width="154" height="24" rx="5" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.5"/>
    <rect x="294" y="246" width="154" height="6" rx="3" fill="#fff" opacity=".18"/>
    <text x="371" y="263" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2.5" fill="#fff">ROVER-1</text>

    <g fill="#c9ccd1">
      <rect x="200" y="232" width="9" height="44" rx="2"/>
      <rect x="272" y="232" width="9" height="44" rx="2"/>
      <rect x="520" y="232" width="9" height="44" rx="2"/>
      <rect x="594" y="232" width="9" height="44" rx="2"/>
    </g>


    <rect x="168" y="220" width="466" height="14" rx="5" fill="url(#plate)"/>
    <rect x="168" y="220" width="466" height="2" rx="1" fill="#ffffff" opacity=".2"/>

    <rect x="184" y="204" width="30" height="16" rx="3" fill="#1b1d22"/>
    <rect x="192" y="198" width="12" height="9" rx="2" fill="#ef4444"/>

    <!-- controller board -->
    <rect x="300" y="168" width="196" height="52" rx="6" fill="url(#pcb)"/>
    <rect x="300" y="168" width="196" height="3" rx="1.5" fill="#fff" opacity=".12"/>
    <g fill="#0b0c0f">
      <rect x="312" y="160" width="82" height="10" rx="2"/>
      <rect x="404" y="160" width="62" height="10" rx="2"/>
    </g>
    <g fill="#d4af37">
      <rect x="316" y="163" width="3" height="4"/><rect x="324" y="163" width="3" height="4"/><rect x="332" y="163" width="3" height="4"/><rect x="340" y="163" width="3" height="4"/><rect x="348" y="163" width="3" height="4"/><rect x="356" y="163" width="3" height="4"/><rect x="364" y="163" width="3" height="4"/><rect x="372" y="163" width="3" height="4"/><rect x="380" y="163" width="3" height="4"/>
      <rect x="408" y="163" width="3" height="4"/><rect x="416" y="163" width="3" height="4"/><rect x="424" y="163" width="3" height="4"/><rect x="432" y="163" width="3" height="4"/><rect x="440" y="163" width="3" height="4"/><rect x="448" y="163" width="3" height="4"/><rect x="456" y="163" width="3" height="4"/>
    </g>
    <rect x="286" y="182" width="22" height="18" rx="2" fill="#aeb4bc"/>
    <rect x="286" y="202" width="18" height="14" rx="3" fill="#0b0c0f"/>
    <rect x="352" y="184" width="40" height="26" rx="2" fill="#0b0c0f"/>
    <rect x="404" y="186" width="16" height="16" rx="2" fill="#374151"/>
    <rect x="430" y="186" width="26" height="22" rx="3" fill="#2563eb"/>
    <circle cx="474" cy="194" r="4" fill="#22c55e" class="led"/>
    <circle cx="474" cy="206" r="4" fill="#f59e0b" class="led2"/>

    <path d="M470 168 C 492 112, 548 102, 566 126" fill="none" stroke="#1b1d22" stroke-width="8" stroke-linecap="round"/>
    <path d="M462 168 C 484 120, 540 110, 560 132" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M396 242 C 390 230, 404 226, 412 222" fill="none" stroke="#ef4444" stroke-width="3"/>
    <path d="M404 242 C 400 232, 414 228, 420 222" fill="none" stroke="#111" stroke-width="3"/>

    <!-- servo -->
    <rect x="566" y="188" width="44" height="32" rx="4" fill="url(#blue)"/>
    <rect x="560" y="196" width="56" height="6" rx="2" fill="#1e40af"/>
    <rect x="580" y="178" width="16" height="12" rx="3" fill="#e5e7eb"/>

    <!-- ultrasonic sensor -->
    <g class="head">
      <rect x="532" y="118" width="128" height="62" rx="8" fill="#111317"/>
      <rect x="540" y="124" width="112" height="50" rx="5" fill="url(#blue)"/>
      <circle cx="570" cy="149" r="21" fill="url(#metal)"/>
      <circle cx="570" cy="149" r="14" fill="url(#mesh)"/>
      <circle cx="622" cy="149" r="21" fill="url(#metal)"/>
      <circle cx="622" cy="149" r="14" fill="url(#mesh)"/>
      <rect x="590" y="128" width="12" height="7" rx="2" fill="#cbd5e1"/>
      <rect x="560" y="178" width="72" height="8" rx="2" fill="#111317"/>
    </g>
  </g>

  <!-- front wheels -->
  <g transform="translate(262 334)"><g class="spin"><use href="#wheel"/></g></g>
  <g transform="translate(538 334)"><g class="spin"><use href="#wheel"/></g></g>

  <!-- laptop control -->
  <g>
    <rect x="34" y="236" width="86" height="54" rx="5" fill="#1f2937" stroke="#64748b" stroke-width="2"/>
    <rect x="40" y="242" width="74" height="42" rx="2" fill="#0b1220"/>
    <g stroke-linecap="round" stroke-width="3">
      <path d="M46 250 h22" stroke="#c084fc"/><path d="M72 250 h14" stroke="#e5e7eb" stroke-opacity=".6"/>
      <path d="M52 258 h30" stroke="#22d3ee"/>
      <path d="M52 266 h18" stroke="#fbbf24"/><path d="M74 266 h20" stroke="#e5e7eb" stroke-opacity=".6"/>
      <path d="M46 274 h12" stroke="#c084fc"/>
    </g>
    <path d="M24 290 H130 L138 302 H16 Z" fill="#94a3b8"/>
    <rect x="64" y="292" width="26" height="4" rx="2" fill="#64748b"/>
    <text x="77" y="322" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#94a3b8">LAPTOP CONTROL</text>
    <g fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round">
      <path class="sig" d="M138 246 Q146 262 138 278"/>
      <path class="sig s2" d="M138 246 Q146 262 138 278"/>
      <path class="sig s3" d="M138 246 Q146 262 138 278"/>
    </g>
  </g>

  <!-- distance readout (HUD) -->
  <g font-family="Consolas, Menlo, 'Courier New', monospace">
    <rect class="hud-frame" x="276" y="24" width="248" height="64" rx="10" fill="#0b1220" fill-opacity=".82" stroke="#22d3ee" stroke-width="2"/>
    <text x="292" y="45" font-size="11" letter-spacing="1.5" fill="#94a3b8">ULTRASONIC SENSOR</text>
    <rect x="292" y="72" width="216" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
    <rect class="bar" x="292" y="72" width="216" height="6" rx="3" fill="#22d3ee"/>
    <g font-size="15" font-weight="700">
      <text class="h h1" x="292" y="64" fill="#e2e8f0">82 cm · path clear</text>
      <text class="h h2" x="292" y="64" fill="#e2e8f0">54 cm · path clear</text>
      <text class="h h3" x="292" y="64" fill="#e2e8f0">31 cm · slowing down</text>
      <text class="h h4" x="292" y="64" fill="#f87171">18 cm · OBSTACLE! STOP</text>
      <text class="h h5" x="292" y="64" fill="#fbbf24">Scanning left ↔ right…</text>
      <text class="h h6" x="292" y="64" fill="#fbbf24">Left is clear · turning ↰</text>
      <text class="h h7" x="292" y="64" fill="#4ade80">Path clear · driving ✓</text>
    </g>
  </g>

  <!-- top-view mini map -->
  <g>
    <rect x="20" y="20" width="150" height="132" rx="10" fill="#0b1220" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".12"/>
    <rect x="20" y="20" width="150" height="132" rx="10" fill="url(#minigrid)"/>
    <text x="32" y="38" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5" fill="#94a3b8">TOP VIEW</text>
    <path d="M100 132 L100 88 Q100 72 84 72 L34 72" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 4"/>
    <rect class="miniobs" x="91" y="46" width="18" height="16" rx="2" fill="#c08a4e"/>
    <polygon class="minicar" points="-8,-6 8,0 -8,6" fill="#f5c518" stroke="#0b1220" stroke-width="1.5"/>
  </g>
</svg>
